
name: Awaduya EC Report

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install packages
        run: npm install

      - name: Create GA4 key file
        env:
          GA4_KEY: ${{ secrets.GA4_KEY }}
        run: |
          if [ -z "$GA4_KEY" ]; then
            echo "GA4_KEY secret is empty or unavailable"
            exit 1
          fi
          node -e "require('fs').writeFileSync('ga4-key.json', process.env.GA4_KEY)"

      - name: Send report
        run: node index.js
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
